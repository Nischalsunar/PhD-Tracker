<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhD Navigator · Workspace concept</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#17222b;font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;border:1px solid #d8e1e7;color:#294554;border-radius:8px;padding:9px 13px}button:hover{background:#edf4f8}button:focus-visible,a:focus-visible{outline:3px solid #65b7e4;outline-offset:3px}.primary{background:#17658f;color:white;border-color:#17658f}.primary:hover{background:#125274;color:white}aside{position:fixed;inset:0 auto 0 0;width:224px;background:#143442;color:#d9e7ee;padding:26px 16px;z-index:20;transition:transform .2s}aside strong{font-size:19px;letter-spacing:-.5px}aside small{color:#9bb7c4}nav{display:grid;gap:7px;margin:33px 0}nav button{background:none;border:0;color:#c0d2dc;text-align:left;padding:12px}nav button.active{background:#265467;color:white}aside .caption{font-size:10px;letter-spacing:1.6px;color:#92acb9;margin:28px 12px 12px}.category{display:block;width:100%;text-align:left;color:#c9dce6;background:none;border:0;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px}.layout{margin-left:224px}header{height:76px;position:sticky;top:0;z-index:10;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid #d8e1e7;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.subtle{font-size:12px;color:#6a7f8b}.pill{display:inline-block;border-radius:20px;background:#eaf2f7;color:#37627d;font-size:11px;padding:5px 9px}.content{max-width:1360px;margin:auto;padding:28px 32px}h1{font-size:28px;font-weight:600;letter-spacing:-.8px;margin:4px 0 10px}h2{font-size:16px;font-weight:600;margin:0 0 18px}h3{font-size:14px;margin:0 0 7px}p{line-height:1.6}.muted{color:#6d7e89}.eyebrow{font-size:10px;font-weight:600;letter-spacing:1.6px;color:#698394}.notice{margin:22px 0;padding:12px 15px;border:1px solid #d8e5ee;border-radius:9px;background:#edf5fa;color:#526e80;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.card,.panel{background:white;border:1px solid #d8e1e7;border-radius:12px;padding:22px;box-shadow:0 3px 10px #14344203}.card b{display:block;font-size:30px;font-weight:600;margin:12px 0 5px;letter-spacing:-1px}.icon{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:#eaf3f9;color:#17658f}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.panel{margin-bottom:20px}.item{padding:17px 0;border-bottom:1px solid #edf1f4}.item:last-child{border:0}.item p{margin:5px 0}.bar{display:flex;gap:4px;height:11px;overflow:hidden;border-radius:10px;margin:20px 0}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#6d7e89}.toolbar{display:flex;gap:12px;margin:20px 0}input,textarea,select{border:1px solid #d8e1e7;border-radius:8px;background:#fff;color:#17222b;padding:10px;max-width:100%}input,textarea{width:100%}textarea{min-height:100px}label{display:grid;gap:7px;margin-bottom:17px;font-size:12px;color:#526a78}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#78909d;background:#f8fafb}th,td{padding:16px;border-bottom:1px solid #edf1f4}.tablewrap{overflow:auto;padding:0}.namebutton{border:0;background:transparent;padding:0;color:#17658f;text-align:left;font-weight:600}.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#e8eff5;color:#54738d;font-weight:600;flex-shrink:0}.empty{padding:26px;text-align:center;background:#f7fafc;border:1px dashed #d8e1e7;border-radius:9px;color:#70828e}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid #d8e1e7;border-top:1px solid #d8e1e7;margin-top:18px}.day{min-height:115px;padding:9px;border-right:1px solid #d8e1e7;border-bottom:1px solid #d8e1e7;background:#fff;font-size:12px}.day.today{background:#f0f7fc}.day.blank{background:#f8fafb}.weekday{text-align:center;font-size:10px;color:#698394;background:#f6f9fb;padding:10px;border-right:1px solid #d8e1e7;border-bottom:1px solid #d8e1e7}.event{font-size:10px;text-align:left;width:100%;padding:6px;background:#e5eff9;border:0;color:#285d86;margin-top:7px;overflow-wrap:anywhere}.week .day{min-height:230px}.badge{background:#f0edf9;color:#756593;font-size:10px;padding:4px 7px;border-radius:5px}.completed{text-decoration:line-through;color:#8a99a3}a{color:#17658f}dialog{border:1px solid #d8e1e7;border-radius:16px;width:min(520px,92vw);max-height:90vh;padding:28px;box-shadow:0 20px 80px #14344233}dialog::backdrop{background:#14344266;backdrop-filter:blur(3px)}.collapsed aside{transform:translateX(-100%)}.collapsed .layout{margin-left:0}.overlay-close{display:none}.error{color:#9b3a3a}footer{font-size:11px;color:#78909d;margin-top:20px}@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.content{padding:24px 18px}header{padding:0 18px}.layout{margin-left:0}aside{transform:translateX(-100%);box-shadow:0 0 0 100vw #14344255}.drawer aside{transform:translateX(0)}.overlay-close{display:block;margin-top:20px}.day{min-height:85px;padding:5px}.calendar{min-width:540px}.calendar-wrap{overflow:auto}.save-label{display:none}}@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style><aside><div class="row"><span class="icon" style="background:#285164;color:white">N</span><strong>PhD Navigator</strong></div><p><small>Your next chapter, organized.</small></p><nav id="nav"></nav><div class="caption">ACTIVITY CATEGORIES</div><button class="category" onclick="go('My Tasks','Research')"><i class="dot" style="background:#9badcf"></i>Research</button><button class="category" onclick="go('My Tasks','Outreach')"><i class="dot" style="background:#92c2bb"></i>Outreach</button><button class="category" onclick="go('My Tasks','Meeting')"><i class="dot" style="background:#c8add3"></i>Meetings</button><div class="caption">DESIGN REVIEW</div><small style="padding:12px;display:block;line-height:1.6">Interactive concept<br/>Fictional examples only</small><button class="overlay-close" onclick="toggleSidebar()">Close menu</button></aside><div class="layout"><header><div class="row"><button aria-label="Toggle sidebar" onclick="toggleSidebar()">☰</button><span id="pageName">Dashboard</span></div><div class="row"><span class="subtle save-label" id="saveState">Preview session · not saved to a database</span><span class="pill">Design preview</span></div></header><main class="content"><div id="view"></div><footer>Prototype only · Changes reset on refresh · No emails are sent · Nothing published</footer></main></div><dialog id="dialog"><form id="form"><h2 id="dialogTitle"></h2><div id="fields"></div><p id="error" class="error" role="alert"></p><div class="row"><button type="button" onclick="$('#dialog').close()">Cancel</button><button class="primary">Save in preview</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const shift=(date,n)=>{const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const stages=['Researching','Ready to contact','Contacted','Replied','Meeting scheduled','Not pursuing'];
let professors=[{id:'p1',name:'Dr. Mira Vale',university:'Cedar Bay University (fictional)',field:'Human–AI collaboration',status:'Researching',email:'',linkedin:'',notes:[{date:today(),type:'Research note',direction:'',text:'Fictional example: investigate how this lab studies collaborative decision-making.'}]},{id:'p2',name:'Dr. Theo Arden',university:'Silvermere Institute (fictional)',field:'Accessible learning systems',status:'Contacted',email:'',linkedin:'',notes:[{date:today(),type:'Email',direction:'Sent',text:'Fictional example: introductory outreach logged for demonstration.'}]},{id:'p3',name:'Dr. Lena Solis',university:'Cedar Bay University (fictional)',field:'Cognitive ergonomics',status:'Replied',email:'',linkedin:'',notes:[{date:today(),type:'Email',direction:'Received',text:'Fictional example reply; no real correspondence.'}]}];
let tasks=[{id:'t1',pid:'p1',title:'Read lab research overview',category:'Research',date:shift(today(),1),done:false},{id:'t2',pid:'p2',title:'Prepare a follow-up question',category:'Outreach',date:shift(today(),3),done:false},{id:'t3',pid:'p3',title:'Outline topics to discuss',category:'Meeting',date:'',done:false}],history=[],page='Dashboard',selected=null,category='',calendarMode='Month',cursor=today();
const pages=['Dashboard','Professors','My Tasks','Calendar','Activity History','Settings'];
function toggleSidebar(){if(innerWidth<=950)document.body.classList.toggle('drawer');else document.body.classList.toggle('collapsed')}
function go(p,c=''){page=p;category=c;selected=null;document.body.classList.remove('drawer');render()}
function changed(message){history.unshift({time:new Date().toLocaleTimeString(),text:message});$('#saveState').textContent='Updated in preview only · resets on refresh'}
function top(title,description,button,action){return `<div class="row"><div><div class="eyebrow">YOUR PERSONAL RESEARCH WORKSPACE</div><h1>${esc(title)}</h1><p class="muted">${esc(description)}</p></div>${button?`<button class="primary" onclick="${action}">${button}</button>`:''}</div><div class="notice">Fresh fictional examples · Interactive design review. Database saving, authentication, backups, and advanced calendar gestures are <b>proposed</b>.</div>`}
function person(id){return professors.find(p=>p.id===id)}
function taskRows(items){return items.map(t=>`<div class="item row"><div><h3 class="${t.done?'completed':''}">${esc(t.title)}</h3><p class="subtle">${esc(person(t.pid)?.name||'Unlinked task')} · ${esc(t.category)} · ${t.date||'Unscheduled'}${t.date&&t.date<today()&&!t.done?' · Overdue':''}</p></div><div class="row"><button onclick="editTask('${t.id}')">Edit</button><button onclick="completeTask('${t.id}')">${t.done?'Reopen':'Complete'}</button></div></div>`).join('')||'<p class="empty">No activities here yet.</p>'}
function completeTask(id){const t=tasks.find(t=>t.id===id);t.done=!t.done;changed('Task '+(t.done?'completed: ':'reopened: ')+t.title);render()}
function render(){ $('#pageName').textContent=selected?'Professor profile':page;$('#nav').innerHTML=pages.map((p,i)=>`<button ${p===page?'class="active" aria-current="page"':''} onclick="go('${p}')">${['▦','♙','✓','▤','↺','⚙'][i]} &nbsp; ${p}</button>`).join('');if(selected){profile();return}if(page==='Dashboard')dashboard();else if(page==='Professors')list();else if(page==='My Tasks')taskPage();else if(page==='Calendar')calendar();else if(page==='Activity History')activity();else settings()}
function dashboard(){const open=tasks.filter(t=>!t.done),colors=['#8fabc5','#72b1ce','#79b8a8','#b5a1c8','#d9b883','#b6bdc4'];$('#view').innerHTML=top('A little clarity. A next step.','Keep your research, connections, and commitments together.','+ Add professor','editProfessor()')+`<div class="cards">${[['♙',professors.length,'Professors saved'],['↗',professors.reduce((n,p)=>n+p.notes.filter(x=>x.direction==='Sent').length,0),'Outreach recorded'],['◷',open.length,'Open tasks'],['▤',new Set(professors.map(p=>p.university)).size,'Universities explored']].map(([i,n,l])=>`<div class="card"><span class="icon">${i}</span><b>${n}</b><span class="muted">${l}</span></div>`).join('')}</div><div class="grid"><section class="panel"><div class="row"><h2>Your next steps</h2><button onclick="go('My Tasks')">View tasks →</button></div>${taskRows(open.filter(t=>t.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4))}<p class="subtle">${open.filter(t=>!t.date).length} unscheduled · Dates are assigned explicitly.</p></section><section class="panel"><h2>Outreach pipeline</h2><p class="muted">Where your connections stand.</p><div class="bar">${stages.map((s,i)=>`<span style="width:${professors.filter(p=>p.status===s).length/Math.max(1,professors.length)*100}%;background:${colors[i]}"></span>`).join('')}</div><div class="legend">${stages.map((s,i)=>`<span><i class="dot" style="background:${colors[i]}"></i>${s} (${professors.filter(p=>p.status===s).length})</span>`).join('')}</div></section></div><section class="panel"><h2>People you’re exploring</h2>${professors.slice(0,3).map(p=>`<div class="item row"><div class="row"><span class="avatar">${esc(p.name.split(' ').slice(1).map(x=>x[0]).join(''))}</span><div><h3>${esc(p.name)}</h3><span class="subtle">${esc(p.field)}</span></div></div><button onclick="openProfile('${p.id}')">Open profile →</button></div>`).join('')}</section>`}
function list(){ $('#view').innerHTML=top('Your professors','Start with a person. Explore their work. Keep notes together.','+ Add professor','editProfessor()')+`<div class="toolbar"><input id="search" aria-label="Search professors" placeholder="Search name, university, or research interest…" oninput="filterPeople()"><select id="stage" aria-label="Filter status" onchange="filterPeople()"><option value="">All statuses</option>${stages.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="panel tablewrap"><table><thead><tr><th>Professor / university</th><th>Field of interest</th><th>Status</th></tr></thead><tbody id="people"></tbody></table><p id="emptyPeople" class="empty" hidden>No professors match your search.</p></div>`;filterPeople()}
function filterPeople(){const q=$('#search').value.toLowerCase(),s=$('#stage').value;const matches=professors.filter(p=>(!s||p.status===s)&&`${p.name} ${p.university} ${p.field}`.toLowerCase().includes(q));$('#people').innerHTML=matches.map(p=>`<tr><td><button class="namebutton" onclick="openProfile('${p.id}')">${esc(p.name)}</button><p class="subtle">${esc(p.university)}</p></td><td>${esc(p.field)}</td><td><span class="pill">${esc(p.status)}</span></td></tr>`).join('');$('#emptyPeople').hidden=!!matches.length}
function openProfile(id){page='Professors';selected=id;render()}
function validLinkedIn(v){try{const u=new URL(v);return u.protocol==='https:'&&(u.hostname==='linkedin.com'||u.hostname.endsWith('.linkedin.com'))}catch{return false}}
function profile(){const p=person(selected);$('#view').innerHTML=`<button onclick="go('Professors')">← Professors</button>`+top(p.name,p.university,'Edit profile',`editProfessor('${p.id}')`)+`<div class="grid"><div><section class="panel"><div class="row"><h2>Notes & communication</h2><button class="primary" onclick="addNote()">+ Add record</button></div>${p.notes.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<article class="item"><div class="row"><span class="pill">${esc(n.type)}${n.direction?' · '+esc(n.direction):''}</span><span class="subtle">${esc(n.date)}</span></div><p style="white-space:pre-wrap">${esc(n.text)}</p></article>`).join('')||'<p class="empty">Capture a research observation or a conversation.</p>'}</section><section class="panel"><div class="row"><h2>Next steps</h2><button onclick="editTask()">+ Add task</button></div>${taskRows(tasks.filter(t=>t.pid===p.id))}</section></div><section class="panel" style="align-self:start"><h2>Research & contact</h2><p class="subtle">FIELD OF INTEREST</p><p>${esc(p.field)||'Not added'}</p><p class="subtle">CONTACT STATUS</p><span class="pill">${esc(p.status)}</span><p class="subtle" style="margin-top:28px">CONTACT LINKS</p><p>${p.email?`<a href="mailto:${esc(p.email)}">Email ↗</a>`:'Email not added'}</p><p>${validLinkedIn(p.linkedin)?`<a href="${esc(p.linkedin)}" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>`:'LinkedIn not added'}</p><p class="subtle">Links open the service. Messages are never sent automatically.</p></section></div>`}
function taskPage(){const items=tasks.filter(t=>!category||t.category===category);$('#view').innerHTML=top(category?category+' activities':'My tasks','Planning completion is separate from professor contact status.','+ Add task','editTask()')+`<div class="toolbar">${['','Research','Outreach','Meeting'].map(c=>`<button onclick="go('My Tasks','${c}')" class="${c===category?'primary':''}">${c||'All activities'}</button>`).join('')}</div><section class="panel">${taskRows(items)}</section>`}
function calendar(){const start=new Date(cursor+'T12:00:00Z');let dates=[];if(calendarMode==='Month'){const first=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth(),1,12)),count=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()+1,0)).getUTCDate();dates=Array(first.getUTCDay()).fill('');for(let i=1;i<=count;i++)dates.push(`${cursor.slice(0,7)}-${String(i).padStart(2,'0')}`);while(dates.length%7)dates.push('')}else{const first=shift(cursor,-start.getUTCDay());dates=Array.from({length:7},(_,i)=>shift(first,i))}$('#view').innerHTML=top('Make space for what matters.','Only explicitly dated tasks appear here. Unscheduled tasks stay in My Tasks.','+ Schedule task','editTask()')+`<section class="panel"><div class="row"><div class="row"><button aria-label="Previous period" onclick="moveCalendar(-1)">←</button><h2 style="margin:0">${start.toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'})}</h2><button aria-label="Next period" onclick="moveCalendar(1)">→</button></div><div class="row"><button onclick="cursor=today();render()">Today</button>${['Month','Week'].map(m=>`<button class="${m===calendarMode?'primary':''}" onclick="calendarMode='${m}';render()">${m}</button>`).join('')}</div></div><div class="calendar-wrap"><div class="calendar ${calendarMode==='Week'?'week':''}">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="weekday">${d}</div>`).join('')}${dates.map(d=>`<div class="day ${!d?'blank':d===today()?'today':''}">${d?Number(d.slice(-2)):''}${d?tasks.filter(t=>t.date===d).map(t=>`<button class="event ${t.done?'completed':''}" onclick="editTask('${t.id}')">${esc(t.title)}</button>`).join(''):''}</div>`).join('')}</div></div><p class="subtle">${tasks.filter(t=>!t.date).length} unscheduled tasks · Click an activity to change its date.</p></section><p class="muted"><span class="badge">Proposed</span> Day/work-week views, 30-minute blocks, drag, resize, overlaps, multi-day assignments, and current-time indicator.</p>`}
function moveCalendar(n){if(calendarMode==='Week')cursor=shift(cursor,7*n);else{const d=new Date(cursor.slice(0,7)+'-01T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+n);cursor=d.toISOString().slice(0,10)}render()}
function activity(){$('#view').innerHTML=top('Activity history','Changes made during this preview session.','','')+`<section class="panel">${history.map(h=>`<div class="item"><span class="subtle">${esc(h.time)}</span><p>${esc(h.text)}</p></div>`).join('')||'<p class="empty">Add a note or update a task to see an activity here.</p>'}</section><p class="muted"><span class="badge">Proposed</span> Durable, timestamped audit history and restore points.</p>`}
function settings(){$('#view').innerHTML=top('Workspace settings','A clear boundary between this preview and the planned platform.','','')+`<section class="panel"><h2>Demonstrated in this preview</h2><p>Professor profiles, search and filters, manual communication notes, tasks, month/week calendar, session activity history, collapsible navigation, and mobile drawer.</p><p>Display time zone: America/New_York. Dates remain calendar dates.</p></section><section class="panel"><h2>Proposed for the approved implementation</h2><p>Authentication · Private database storage · Saving / Saved / Failed states · Recovery of pending edits · Backups · Persistent change history · Editable time zone · Custom activity categories · Advanced calendar gestures.</p><div class="notice">This preview does not save to a database or browser storage. Refreshing resets all changes. No real personal data should be entered.</div></section>`}
function input(name,label,value='',type='text',required=false){return `<label>${label}<input name="${name}" value="${esc(value)}" type="${type}" ${required?'required':''}></label>`}
function options(values,current){return values.map(v=>`<option ${v===current?'selected':''}>${esc(v)}</option>`).join('')}
function form(title,fields,save){$('#dialogTitle').textContent=title;$('#fields').innerHTML=fields;$('#error').textContent='';$('#form').onsubmit=e=>{e.preventDefault();try{save(Object.fromEntries(new FormData(e.target)));$('#dialog').close();render()}catch(e){$('#error').textContent=e.message}};$('#dialog').showModal()}
function editProfessor(id){const p=person(id)||{name:'',university:'',field:'',email:'',linkedin:'',status:'Researching',notes:[]};form(id?'Edit professor':'Add professor',input('name','Professor name',p.name,'text',true)+input('university','University',p.university)+input('field','Field of interest',p.field)+input('email','Email',p.email,'email')+input('linkedin','LinkedIn URL',p.linkedin,'url')+`<label>Contact status<select name="status">${options(stages,p.status)}</select></label>`,v=>{if(!v.name.trim())throw Error('Enter a professor name.');if(v.linkedin&&!validLinkedIn(v.linkedin))throw Error('Enter an HTTPS LinkedIn URL.');const record={...p,...v,name:v.name.trim(),id:id||crypto.randomUUID()};professors=id?professors.map(x=>x.id===id?record:x):[...professors,record];changed((id?'Updated: ':'Added: ')+record.name);selected=record.id;page='Professors'})}
function addNote(){form('Add communication or research note',`<label>Record type<select name="type" onchange="noteDirection()">${options(['Research note','Email','LinkedIn','Meeting'],'')}</select></label>`+input('date','Date',today(),'date',true)+`<label id="direction" hidden>Direction<select name="direction" disabled><option>Sent</option><option>Received</option></select></label><label>Short note<textarea name="text" required placeholder="What did you learn or discuss?"></textarea></label>`,v=>{if(!v.text.trim())throw Error('Write a short note.');person(selected).notes.push({...v,direction:['Email','LinkedIn'].includes(v.type)?v.direction:'',text:v.text.trim()});changed('Added '+v.type.toLowerCase()+' for '+person(selected).name)})}
function noteDirection(){const show=['Email','LinkedIn'].includes($('#form select[name=type]').value);$('#direction').hidden=!show;$('#form select[name=direction]').disabled=!show}
function editTask(id){const t=tasks.find(t=>t.id===id)||{title:'',pid:selected||'',category:'Research',date:''};form(id?'Edit task':'Add task',input('title','Next action',t.title,'text',true)+`<label>Related professor<select name="pid"><option value="">Unlinked task</option>${professors.map(p=>`<option value="${p.id}" ${p.id===t.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label>Category<select name="category">${options(['Research','Outreach','Meeting'],t.category)}</select></label>`+input('date','Assign a date (optional)',t.date,'date'),v=>{if(!v.title.trim())throw Error('Enter a task title.');const record={...t,...v,title:v.title.trim(),id:id||crypto.randomUUID(),done:t.done||false};tasks=id?tasks.map(x=>x.id===id?record:x):[...tasks,record];changed((id?'Updated task: ':'Added task: ')+v.title)})}
render();
</script></html>
