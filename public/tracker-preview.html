{align-items:flex-start;flex-direction:column;margin:10px auto;padding:14px}main{margin:0 10px;padding:20px 15px}.stats{grid-template-columns:1fr 1fr}}

/* Refined preview theme */
:root{--ink:#263c36;--muted:#707d76;--line:#e5eae3;--accent:#35634f}body{background:radial-gradient(ellipse at 10% 0%,#eaf0e5 0,transparent 45%),#f6f7f3;color:var(--ink);font-family:Inter,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}aside{max-width:1080px;margin:28px auto 20px;padding:12px 28px}aside h2{font-size:20px;letter-spacing:-.7px;display:flex;align-items:center;gap:10px}aside h2:before{content:'N';display:grid;place-items:center;width:34px;height:34px;background:var(--accent);color:#fff;border-radius:11px;font:italic 23px Georgia,serif;box-shadow:0 4px 12px #35634f20}nav{padding:5px;background:#e9ede6;border:1px solid #e2e7df;border-radius:13px}nav button{border-radius:9px;color:#647268;padding:10px 15px;font-size:12px;font-weight:600}nav button.active{background:white;color:var(--accent);box-shadow:0 2px 5px #20392d0c}main{max-width:1024px;padding:38px 40px;border:1px solid #e0e6dc;border-radius:24px;box-shadow:0 12px 50px #233b2a08}header{padding:4px 0 6px}h1{font-size:30px;font-weight:600;letter-spacing:-1.1px;margin:8px 0 10px}h2{font-size:17px;letter-spacing:-.35px}h3{font-weight:600;letter-spacing:-.25px}.kicker{display:block;color:#84917e;font-size:10px;letter-spacing:2px}.muted{color:var(--muted);font-size:13px}button{font-size:12px;font-weight:600;padding:10px 14px;border-color:var(--line);border-radius:9px;transition:background .15s,box-shadow .15s}button:hover{background:#f0f4ed;box-shadow:0 2px 6px #263c3609}.primary{background:var(--accent);color:white;padding:12px 18px;box-shadow:0 3px 8px #35634f18}.primary:hover{background:#284d3d;color:white}.banner{margin:24px 0;padding:12px 14px;background:#f5f7f0;border:1px solid #e8ecdf;border-radius:10px;color:#6c7764;font-size:11px;line-height:1.6}.banner b{font-size:9px;letter-spacing:.8px;background:#e5edda;color:#577344;padding:4px 7px}.stats{gap:14px;margin:24px 0 32px}.card{position:relative;border:1px solid #e5eae3;background:linear-gradient(130deg,#fbfcf9,#fff);border-radius:14px;padding:21px 23px 23px;font-size:12px;color:var(--muted)}.card:after{content:'↗';position:absolute;right:23px;top:24px;color:#9aaa9c;font-size:14px}.card b{font-size:33px;letter-spacing:-1px;font-weight:500;color:var(--ink);margin:15px 0 7px}.card .symbol{display:grid;place-items:center;background:#edf2e8;color:#61795c;border-radius:10px;width:34px;height:34px;font-size:19px}.card:nth-child(2) .symbol{background:#eef1fa;color:#7281a0}.card:nth-child(3) .symbol{background:#fbf2df;color:#a58b4f}.card:nth-child(4) .symbol{background:#f1edf6;color:#8d78a4}.panel{margin-top:29px;padding-top:24px;border-color:var(--line)}.panel>.row{margin-bottom:8px}.pipeline{height:12px;margin:21px 0 15px;gap:5px}.legend{gap:22px;font-size:11px}.dot{width:8px;height:8px;margin-right:7px}.list{padding:21px 10px;border-color:#edf0e9;border-radius:8px}.list:hover{background:#fafbf7}.list p{margin:9px 0 0}.tag{background:#eef2e8;color:#627451;font-size:11px}.activity-date{background:#f3f5ee;border:1px solid #e6ebdf;padding:11px;border-radius:10px;min-width:60px;color:#64765b}.activity-date small{font-size:9px;font-weight:700;letter-spacing:1px}.activity-date b{font-size:23px;font-weight:500;margin-top:5px}.empty{background:repeating-linear-gradient(135deg,#fafbf8,#fafbf8 12px,#f8faf5 12px,#f8faf5 24px);border:1px dashed #dce4d5;border-radius:12px;text-align:center;padding:32px 20px;font-size:13px;color:#7b8872}.breadcrumb{font-size:12px;color:#8a9484;margin-top:25px}.breadcrumb button{font-size:12px;color:var(--accent)}footer{margin-top:32px;padding-top:18px;font-size:10px;letter-spacing:.3px;color:#8a9485}dialog{padding:32px;border:1px solid #e2e8dc;box-shadow:0 25px 80px #17332230;color:var(--ink)}dialog::backdrop{background:#1d352d55;backdrop-filter:blur(4px)}label{font-size:13px;color:#57674f}input,textarea,select{font-size:14px;border-color:#dfe6d8;background:#fcfdfb;outline:none}input:focus,textarea:focus,select:focus{border-color:#7f9d70;box-shadow:0 0 0 3px #e8f0df}button:focus-visible{outline:3px solid #93ab7b;outline-offset:3px}@media(min-width:1100px){main{margin-bottom:55px}}@media(max-width:800px){aside{padding:12px 18px;margin:10px 0;gap:16px}nav{width:100%;justify-content:space-between}nav button{padding:9px 10px}main{padding:25px 20px;border-radius:18px}h1{font-size:27px}.stats{gap:10px}.card{padding:18px}.card:after{right:17px;top:20px}.legend{gap:12px}.row{flex-wrap:wrap}.grid{gap:0}}@media(prefers-reduced-motion:reduce){button{transition:none}}
</style><aside><h2>PhD Navigator</h2><nav><button onclick="list()">Professors</button><button onclick="followups()">Follow-ups</button></nav></aside><main><header><div><span class="kicker">PEOPLE. IDEAS. CONVERSATIONS.</span><h1 id="heading">Your professors</h1><p class="muted" id="subtitle">Follow your curiosity. Keep the conversation going.</p></div><button class="primary" onclick="editProfessor()">+ Add professor</button></header><div class="banner"><b>DEMO PREVIEW</b> Fictional examples · Saved in this browser only. Use no private data.</div><div id="content"></div><footer>Professor → Field of interest → Contact → Communication notes</footer></main><dialog id="form"><form id="editor"><h2 id="formTitle"></h2><div id="fields"></div><p id="error" role="alert"></p><div class="row"><button type="button" onclick="document.querySelector('dialog').close()">Cancel</button><button class="primary">Save</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key='phd-professor-preview-v1',stages=['Researching','Ready to contact','Contacted','Replied','Meeting scheduled','Not pursuing'];
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
let professors=[{id:'example-1',name:'Dr. Avery Morgan',university:'Example University',field:'Human–AI interaction, accessible technology',email:'',linkedin:'',status:'Researching',records:[{id:'note-1',type:'Research note',date:today(),direction:'',text:'Fictional example: explore the lab’s work on accessible interfaces. No opening verified.',action:'',due:'',done:false}]}],selected=null;
try{const saved=localStorage.getItem(key);if(saved){const data=JSON.parse(saved);if(!Array.isArray(data)||!data.every(p=>p.id&&p.name&&Array.isArray(p.records)))throw Error();professors=data}}catch{alert('Saved preview data could not be loaded. The fictional example will be shown.')}
function persist(next){try{localStorage.setItem(key,JSON.stringify(next));professors=next;return true}catch{$('#error').textContent='Could not save. Browser storage may be full or unavailable.';alert('Could not save to browser storage. Your changes were not saved.');return false}}
function form(title,fields,save){$('#formTitle').textContent=title;$('#fields').innerHTML=fields;$('#error').textContent='';$('#editor').onsubmit=e=>{e.preventDefault();try{if(save(new FormData(e.target))!==false)$('#form').close()}catch(err){$('#error').textContent=err.message}};$('#form').showModal()}
function input(name,label,value='',type='text',required=false){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`}
function options(values,selected){return values.map(v=>`<option ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}
function heading(title,subtitle){$('#heading').textContent=title;$('#subtitle').textContent=subtitle}
function list(){selected=null;heading('Your professors','Discover a connection. Capture an idea. Take the next step.');$('#content').innerHTML=`<div class="stats"><div class="card">Professors saved<b>${professors.length}</b></div><div class="card">Communication records<b>${professors.reduce((n,p)=>n+p.records.filter(r=>r.type!=='Research note').length,0)}</b></div></div><div class="row"><input id="search" aria-label="Search professors" placeholder="Search name, university, or research interests…" oninput="renderList()"><select id="filter" aria-label="Filter status" onchange="renderList()" style="width:210px"><option value="">All statuses</option>${options(stages,'')}</select></div><section id="people"></section>`;renderList()}
function renderList(){const query=$('#search').value.toLowerCase(),stage=$('#filter').value;const matches=professors.filter(p=>(!stage||p.status===stage)&&`${p.name} ${p.university} ${p.field}`.toLowerCase().includes(query));$('#people').innerHTML=matches.map(p=>`<div class="list row"><div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.university)}</p><p>${esc(p.field)||'No research interests added yet'}</p><span class="tag">${esc(p.status)}</span></div><button data-open="${esc(p.id)}">Open profile →</button></div>`).join('')||'<p class="empty">No professors found. Add someone or adjust your search.</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>profile(b.dataset.open))}
function profile(id){selected=id;const p=professors.find(x=>x.id===id);heading(p.name,p.university);$('#content').innerHTML=`<div class="breadcrumb"><button onclick="list()">← All professors</button></div><div class="row"><span class="tag">${esc(p.status)}</span><button onclick="editProfessor(selected)">Edit profile</button></div><section class="panel"><h2>Field of interest</h2><p>${esc(p.field)||'Add research topics that interest you.'}</p><h2>Contact</h2><div class="row" style="justify-content:flex-start">${p.email?`<a href="mailto:${esc(p.email)}">Email ↗</a>`:'<span class="muted">No email added</span>'}${p.linkedin&&safeLinkedIn(p.linkedin)?`<a href="${esc(p.linkedin)}" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>`:'<span class="muted">No LinkedIn added</span>'}</div><p class="muted">Contact links open the service. Log your conversation manually afterward.</p></section><section class="panel"><div class="row"><h2>Notes & communication</h2><button class="primary" onclick="addRecord()">+ Add record</button></div>${p.records.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<article class="list"><div class="row"><span class="tag">${esc(r.type)}${r.direction?' · '+esc(r.direction):''}</span><small class="muted">${esc(r.date)}</small></div><p style="white-space:pre-wrap">${esc(r.text)}</p>${r.action||r.due?`<div class="row"><p class="muted">Next: ${esc(r.action)||'Follow up'}${r.due?' · '+esc(r.due):''} ${!r.done&&r.due&&r.due<today()?' · Overdue':''}</p><button data-done="${esc(r.id)}">${r.done?'Completed · Reopen':'Mark complete'}</button></div>`:''}</article>`).join('')||'<p class="empty">Start with a research observation or a conversation summary.</p>'}</section>`;document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>toggleDone(id,b.dataset.done))}
function safeLinkedIn(value){try{const u=new URL(value);return u.protocol==='https:'&&(u.hostname==='linkedin.com'||u.hostname.endsWith('.linkedin.com'))}catch{return false}}
function editProfessor(id){const p=professors.find(x=>x.id===id)||{name:'',university:'',field:'',email:'',linkedin:'',status:'Researching',records:[]};form(id?'Edit professor':'Add professor',input('name','Professor name',p.name,'text',true)+input('university','University',p.university)+input('field','Field of interest',p.field)+input('email','Email',p.email,'email')+input('linkedin','LinkedIn profile URL',p.linkedin,'url')+`<label>Contact status<select name="status">${options(stages,p.status)}</select></label>`,f=>{const values=Object.fromEntries(f);Object.keys(values).forEach(k=>values[k]=values[k].trim());if(!values.name)throw Error('Enter a professor name.');if(values.linkedin&&!safeLinkedIn(values.linkedin))throw Error('Use an HTTPS LinkedIn profile URL.');const record={...p,...values,id:id||crypto.randomUUID()};if(!persist(id?professors.map(x=>x.id===id?record:x):[...professors,record]))return false;profile(record.id)})}
function addRecord(){const id=selected;form('Add a note or communication',`<label>Record type<select name="type" onchange="updateDirection()">${options(['Research note','Email','LinkedIn','Meeting'],'')}</select></label>`+input('date','Date',today(),'date',true)+`<label id="directionLabel" hidden>Direction<select name="direction" disabled><option>Sent</option><option>Received</option></select></label><label>Note<textarea name="text" required placeholder="What did you learn or discuss?"></textarea></label>`+input('action','Next action (optional)')+input('due','Follow-up date (optional)','','date'),f=>{const values=Object.fromEntries(f);if(!values.text.trim())throw Error('Write a short note.');const record={...values,text:values.text.trim(),direction:['Email','LinkedIn'].includes(values.type)?values.direction:'',id:crypto.randomUUID(),done:false};if(!persist(professors.map(p=>p.id===id?{...p,records:[...p.records,record]}:p)))return false;profile(id)})}
function updateDirection(){const show=['Email','LinkedIn'].includes($('#editor select[name=type]').value);$('#directionLabel').hidden=!show;$('#editor select[name=direction]').disabled=!show}
function toggleDone(pid,rid){if(persist(professors.map(p=>p.id===pid?{...p,records:p.records.map(r=>r.id===rid?{...r,done:!r.done}:r)}:p)))selected?profile(pid):followups()}
function followups(){selected=null;heading('Your next steps','A gentle reminder to keep your conversations moving.');const tasks=professors.flatMap(p=>p.records.filter(r=>(r.action||r.due)&&!r.done).map(r=>({...r,professor:p.name,pid:p.id}))).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));$('#content').innerHTML=tasks.map(r=>`<div class="list row"><div><h3>${esc(r.action)||'Follow up'}</h3><p class="muted">${esc(r.professor)} · ${esc(r.due)||'No date set'} ${r.due&&r.due<today()?' · Overdue':''}</p></div><button data-pid="${esc(r.pid)}" data-rid="${esc(r.id)}">Mark complete</button></div>`).join('')||'<p class="empty">You’re all caught up. Add a follow-up from a professor’s notes.</p>';document.querySelectorAll('[data-rid]').forEach(b=>b.onclick=()=>toggleDone(b.dataset.pid,b.dataset.rid))}
list();
</script></html>
